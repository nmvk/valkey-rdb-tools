[package]
name = "valkey-rdb-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "CLI tool to export Valkey/Redis RDB files to Parquet, CSV, and JSON"

[[bin]]
name = "valkey-rdb"
path = "src/main.rs"

[dependencies]
rdb-parser = { path = "../rdb-parser" }
rdb-to-arrow = { path = "../rdb-to-arrow" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
parquet = { workspace = true }
# filter.rs key-pattern matching only; validate.rs no longer uses it.
glob-match = "0.2"

[dev-dependencies]
tempfile = "3"
